services:
  db:
    image: postgres:16
    container_name: linkedin_ai_advisor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkedin_project
      POSTGRES_USER: useruser
      POSTGRES_PASSWORD: userpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U useruser"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: linkedin_ai_advisor_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://useruser:userpass@db:5432/linkedin_project
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
          sh -c "/app/.venv/bin/alembic upgrade head &&
                /app/.venv/bin/uvicorn backend.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata: